# Textos em português do Brasil das telas de login.
# Sobrescreve as traduções do Keycloak e da extensão de código por e-mail (pt-PT).
loginAccountTitle=Entrar no SecureLogin
email=E-mail
# Mensagem única para qualquer falha de login: credencial errada, conta inexistente,
# bloqueada ou desativada. Mensagens diferentes revelariam se o e-mail tem conta (RNF-005;
# o Keycloak mantém essas chaves iguais de propósito e a tradução precisa preservar isso).
invalidUserMessage=E-mail ou senha inválidos.
invalidUsernameMessage=E-mail ou senha inválidos.
invalidUsernameOrEmailMessage=E-mail ou senha inválidos.
accountTemporarilyDisabledMessage=E-mail ou senha inválidos.
accountPermanentlyDisabledMessage=E-mail ou senha inválidos.
accountDisabledMessage=E-mail ou senha inválidos.
emailOtpForm=Digite o código de {0} dígitos enviado para o seu e-mail.
resendCode=Reenviar código
email-authenticator-display-name=Código por e-mail
email-authenticator-help-text=Receba um código de uso único no seu e-mail.
email-authenticator-resend-cooldown=Aguarde {0} segundos para pedir um novo código.
email-authenticator-too-many-attempts=Muitas tentativas incorretas. Peça um novo código.
# Ativação pelo link de boas-vindas ou convite (US2, US3).
accountUpdatedTitle=Senha definida
accountUpdatedMessage=Sua senha foi definida. Volte ao SecureLogin e entre com ela.
backToApplication=Voltar para o SecureLogin

# Nova autenticação antes de ação sensível (RF-031).
reauthenticate=Por segurança, confirme sua identidade para continuar.
