# Artefatos de terceiros embutidos na imagem do Keycloak (constituição, Princípios X e XI).
# Toda mudança aqui exige atualizar o Dockerfile e registrar a verificação em
# specs/001-identity-access/research.md (R1, R5).

keycloak:
  image: quay.io/keycloak/keycloak:26.7.5
  digest: sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
  note: >-
    Série 26.7 porque a extensão de código por e-mail não tem build para 26.8.x. 2026-10-04:
