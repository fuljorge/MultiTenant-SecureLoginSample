    patches:
      # Remover quando o PR upstream for publicado numa versão:
      # https://github.com/mesutpiskin/keycloak-2fa-email-authenticator/pull/155 (issue #146)
      - patches/0001-limit-email-code-attempts.patch
    build-image: maven:3.9-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320
    verified: >-
      2026-10-02 — código-fonte revisado na T008; patch validado com os 71 testes da
      extensão e com os testes de integração do realm (T012).

