# Gates de qualidade e segurança (constituição, Princípios VIII e X).
# Actions fixadas por hash de commit; ferramentas de segurança por imagem com versão.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (Control Plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Ruff (lint e regras de segurança)
        run: uv run ruff check services/
      - name: Ruff (formatação)
        run: uv run ruff format --check services/
      - name: mypy
        working-directory: services/control-plane
        run: uv run mypy
      - name: pytest (unitários)
        working-directory: services/control-plane
        run: uv run pytest -m "not integration"

  typescript:
    name: TypeScript (Studio e E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Vitest
        run: pnpm test

  contract:
    name: Cliente TypeScript em dia com o OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Regenera OpenAPI e cliente
        run: |
          pnpm --filter @cap/api-client openapi
          pnpm --filter @cap/api-client generate
      - name: Falha se o cliente commitado divergir do gerado
        run: git diff --exit-code -- packages/api-client

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  vulnerabilities:
    name: Vulnerabilidades em dependências (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy (filesystem)
        run: >
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.75.0
          fs /repo --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /repo/.trivyignore.yaml

  images:
    name: Imagens (build e Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build -f services/control-plane/Dockerfile -t cap-control-plane:ci .
          docker build -f apps/studio/Dockerfile -t cap-studio:ci .
          docker build -t cap-keycloak:ci infra/keycloak
      # Falha com vulnerabilidade alta ou crítica que tenha correção, salvo mitigação
      # registrada em .trivyignore.yaml (constituição, Princípio X; T073).
      - name: Trivy (imagens)
        run: |
          for image in cap-control-plane:ci cap-studio:ci cap-keycloak:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock               -v "$PWD/.trivyignore.yaml:/ignore.yaml:ro" aquasec/trivy:0.75.0               image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed               --ignorefile /ignore.yaml --exit-code 1 "$image"
          done

  e2e:
    name: E2E (Playwright, desktop e celular)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Ambiente (compose)
        run: |
          uv run python infra/compose/init_env.py
          docker compose -f infra/compose/docker-compose.yml up -d --build
          # Serviços de inicialização (realm do Keycloak, chave do OpenBao) rodam e terminam.
          for job in keycloak-config openbao-init; do
            id=$(docker compose -f infra/compose/docker-compose.yml ps -aq "$job")
            code=$(timeout 600 docker wait "$id")
            test "$code" = 0 || { docker logs "$id"; exit 1; }
          done
      - name: Control Plane, worker e Studio (imagens do projeto)
        env:
          ENV_FILE: infra/compose/.env.control-plane
        run: |
          docker build -f services/control-plane/Dockerfile -t cap-control-plane:ci .
          docker build -f apps/studio/Dockerfile -t cap-studio:ci             --build-arg CAP_CONTROL_PLANE_URL=http://127.0.0.1:8000 .
          docker run --rm --network host --env-file "$ENV_FILE" cap-control-plane:ci             alembic upgrade head
          docker run -d --name cp --network host --env-file "$ENV_FILE" cap-control-plane:ci
          docker run -d --name worker --network host --env-file "$ENV_FILE"             cap-control-plane:ci cap-worker
          docker run -d --name studio --network host cap-studio:ci
          for url in http://127.0.0.1:8000/api/v1/me http://localhost:3000/; do
            timeout 120 sh -c "until curl -s -o /dev/null $url; do sleep 2; done"
          done
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Playwright
        env:
          CI: "true"
          STUDIO_URL: http://localhost:3000
        run: pnpm e2e
      # CS-007: nenhum segredo nos logs da execução (T071).
      - name: Varredura de segredos nos logs
        if: always()
        run: |
          mkdir -p logs
          for c in cp worker studio; do docker logs "$c" > "logs/$c.log" 2>&1 || true; done
          docker compose -f infra/compose/docker-compose.yml logs --no-color keycloak             > logs/keycloak.log 2>&1 || true
          uv run python infra/ci/scan_logs_for_secrets.py logs/cp.log logs/worker.log logs/studio.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
